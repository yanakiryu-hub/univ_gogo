<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>univ_gogo - 경쟁률보드</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>univ_gogo — 경쟁률보드</h1>
      <div class="meta" id="last-updated">마지막 업데이트: 불러오는 중...</div>
    </div>
  </header>

  <nav class="site-nav">
    <a href="/">홈</a>
    <a href="/board.html" class="active">경쟁률보드</a>
  </nav>

  <main>
    <div class="sub-tabs" id="sub-tabs">
      <button class="sub-tab active" data-scope="core">핵심 6개 학과</button>
      <button class="sub-tab" data-scope="all">전체</button>
    </div>

    <div id="stat-cards" class="stat-cards"></div>

    <div class="badge-key" style="margin-bottom:10px;">
      <span class="badge badge-blue">5:1↑</span>
      <span class="badge badge-magenta">10:1↑</span>
      <span class="badge badge-orange">20:1↑</span>
      <span class="badge badge-red">30:1↑</span>
    </div>

    <div class="univ-card" style="margin-bottom:20px;">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>대학</th>
              <th>전형</th>
              <th>모집단위(학과)</th>
              <th>모집인원</th>
              <th>지원인원</th>
              <th>경쟁률</th>
              <th>마지막 업데이트</th>
              <th>업데이트 안내</th>
            </tr>
          </thead>
          <tbody id="board-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="chart-box">
      <div class="card-title" style="font-weight:700; font-size:15px; margin-bottom:2px;">경쟁률 추이</div>
      <div style="font-size:12px; color:#999; margin-bottom:14px;">전형별 시간대별 경쟁률 변화</div>
      <div class="chart-canvas-wrap">
        <canvas id="trend-chart"></canvas>
      </div>
    </div>
  </main>

  <script src="/badges.js"></script>
  <script src="/board.js"></script>
</body>
</html>
